<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика · 5 клас · Домашня робота</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=STIX+Two+Text:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3fb;--card:#fff;--tx:#16152e;--mu:#6c6a8a;--ln:#e4e2f3;--ok:#14a86b;--mid:#e8a213;--bad:#ee4b6a;--c:hsl(250 78% 60%);--cs:color-mix(in srgb,var(--c) 11%,transparent);--m:"STIX Two Text","Cambria Math",Georgia,serif;color-scheme:light only;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tiles div{background:var(--cs);border-radius:18px;padding:12px 6px}
.tiles b{display:block;font:800 26px/1.1 Onest}
.tiles span{font-size:13px;color:var(--mu);font-weight:700}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:500 16px/1.5 Onest,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;background:radial-gradient(40% 35% at 10% 0%,color-mix(in srgb,var(--c) 28%,transparent),transparent),radial-gradient(35% 30% at 100% 20%,color-mix(in srgb,var(--c) 14%,#ff7ab8 12%),transparent);transition:background .6s}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font:800 clamp(34px,10vw,54px)/1 Onest;letter-spacing:-.04em;margin:8px 0 10px}
h1 em{font-style:normal;color:var(--c)}
h2{font:800 22px/1.2 Onest;letter-spacing:-.02em;margin:0}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:28px;padding:20px;box-shadow:0 24px 48px -32px color-mix(in srgb,var(--c) 55%,transparent);animation:in .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stack{display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:14px}
.chip{background:var(--cs);color:var(--c);border-radius:99px;padding:5px 13px;font-weight:800;font-size:14px;white-space:nowrap}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg i{flex:1;height:7px;border-radius:9px;background:var(--ln)}
.seg .ok{background:var(--ok)}.seg .no{background:var(--bad)}.seg .now{background:var(--c)}
.q{font:600 clamp(22px,6vw,28px)/1.55 var(--m);padding:8px 2px 18px;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt,.btn{font:700 20px/1.3 var(--m);color:var(--tx);background:var(--card);border:1.5px solid var(--ln);border-radius:20px;padding:14px 16px;min-height:60px;cursor:pointer;text-align:center;transition:transform .15s cubic-bezier(.3,1.6,.5,1),border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-2px)}
.opt:active:not(:disabled),.btn:active{transform:scale(.97)}
.opt.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-color:var(--ok)}
.opt.no{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad)}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.no){opacity:.5}
.btn{font:800 17px Onest;color:#fff;background:var(--c);border:0;width:100%;box-shadow:0 14px 26px -14px var(--c)}
.btn.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--ln);box-shadow:none}
input{font:700 22px var(--m);width:100%;padding:14px 16px;border-radius:20px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);margin-bottom:10px;outline:none;min-height:60px}
input:focus{border-color:var(--c);box-shadow:0 0 0 4px var(--cs)}
.fb{margin-top:14px;border-radius:20px;padding:14px 16px;background:var(--cs);animation:in .3s}
.fb b{display:block;font-size:17px;margin-bottom:2px}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}
.fb p{margin:2px 0 14px;color:var(--mu)}
.f{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.82em;line-height:1.15}
.f i{font-style:normal;padding:0 .2em}.f i:first-child{border-bottom:.07em solid currentColor}
.w{margin-right:.05em}
.blk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--ln);border-radius:20px;background:var(--card)}
.blk .e{font-size:24px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--cs)}
.blk small{display:block;color:var(--mu);font-weight:500}
.blk div:nth-child(2){flex:1;font-weight:700;line-height:1.25}
.grade{font:800 clamp(80px,26vw,130px)/1 Onest;letter-spacing:-.06em;text-align:center;margin:6px 0 0}
.grade small{font-size:.28em;color:var(--mu);letter-spacing:0;font-weight:700}
.gl{text-align:center;font-weight:700;margin-bottom:14px}
.hi{color:var(--ok)}.md{color:var(--mid)}.lo{color:var(--bad)}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.sc{font:800 22px Onest;min-width:64px;text-align:right}
.sc small{font-size:13px;color:var(--mu);font-weight:700}
.wr{border-top:1px solid var(--ln);padding:14px 0 2px}
.wr:first-of-type{border-top:0}
.wr .t{font:600 20px/1.5 var(--m);margin:6px 0}
.wr .r{font-size:15px}
.wr .r span{font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<script>
const B=[
["Додавання й віднімання","➕",250,[
["Обчисліть: 347 + 589","936",["926","836","946"],"347 + 589 = 936."],
["Обчисліть: 1000 − 468","532",["542","632","568"],"1000 − 468 = 532."],
["Обчисліть зручним способом: 276 + 38 + 62","376",["366","386","336"],"38 + 62 = 100, тож 276 + 100 = 376."],
["У школі навчається 1\u00a0248 учнів, із них 653 — хлопці. Скільки в школі дівчат?","595",["605","495","1\u00a0901"],"1\u00a0248 − 653 = 595."]]],
["Множення й ділення","✖️",200,[
["Обчисліть: 27 × 14","378",["368","388","358"],"27 × 10 = 270, 27 × 4 = 108, разом 378."],
["Обчисліть зручним способом: 25 × 13 × 4","1300",["1030","130","1200"],"25 × 4 = 100, далі 100 × 13 = 1300."],
["Обчисліть: 756 : 9","84",["74","86","94"],"9 × 84 = 756."],
["У залі 18 рядів по 24 місця. Скільки всього місць у залі?","432",["422","412","442"],"18 × 24 = 432."]]],
["Степінь числа","🔺",160,[
["Обчисліть: 7²","49",["14","77","21"],"7² = 7 × 7 = 49."],
["Обчисліть: 3³","27",["9","6","81"],"3³ = 3 × 3 × 3 = 27."],
["Обчисліть: 2⁵","32",["10","25","64"],"2⁵ = 2 × 2 × 2 × 2 × 2 = 32."],
["Знайдіть значення виразу: 5² + 2³","33",["17","29","41"],"5² = 25, 2³ = 8, разом 33."]]],
["Рівняння","⚖️",330,[
["Розв’яжіть рівняння: x + 38 = 112. Чому дорівнює x?","74",[],"x = 112 − 38 = 74."],
["Розв’яжіть рівняння: x − 245 = 316. Чому дорівнює x?","561",[],"x = 316 + 245 = 561."],
["Розв’яжіть рівняння: 7 · x = 168. Чому дорівнює x?","24",[],"x = 168 : 7 = 24."],
["Розв’яжіть рівняння: 156 : x = 12. Чому дорівнює x?","13",[],"x = 156 : 12 = 13."]]],
["Звичайні дроби","🍕",25,[
["Обчисліть: {2|9} + {5|9}","{7|9}",["{7|18}","{3|9}","{10|9}"],"Знаменник не змінюємо, додаємо чисельники: 2 + 5 = 7."],
["Обчисліть: {7|8} − {3|8}","{4|8}",["{4|16}","{10|8}","{3|8}"],"Віднімаємо чисельники: 7 − 3 = 4, знаменник той самий."],
["Порівняйте дроби: {5|9} … {7|9}","<",[">","="],"Знаменники однакові, а 5 < 7, тож перший дріб менший."],
["Обчисліть: 1 − {3|7}","{4|7}",["{2|7}","{4|14}","{7|4}"],"1 = {7|7}, тоді {7|7} − {3|7} = {4|7}."]]],
["Мішані числа","🥧",290,[
["Виділіть цілу частину: {17|5}","3{2|5}",["2{3|5}","3{3|5}","4{2|5}"],"17 : 5 = 3 і остача 2, тож 3{2|5}."],
["Подайте у вигляді неправильного дробу: 4{3|7}","{31|7}",["{12|7}","{43|7}","{25|7}"],"4 · 7 + 3 = 31, знаменник 7."],
["Обчисліть: 2{1|6} + 3{4|6}","5{5|6}",["5{3|6}","6{5|6}","5{1|6}"],"Цілі: 2 + 3 = 5, дробові: {1|6} + {4|6} = {5|6}."],
["Порівняйте мішані числа: 3{2|5} … 2{4|5}",">",["<","="],"Цілі частини різні: 3 > 2, тож перше число більше."]]],
["Десяткові дроби: + і −","🪄",185,[
["Обчисліть: 4,76 + 3,58","8,34",["8,24","8,44","7,34"],"Записуємо кома під комою: 4,76 + 3,58 = 8,34."],
["Обчисліть: 10 − 6,35","3,65",["4,65","3,75","4,35"],"10,00 − 6,35 = 3,65."],
["Обчисліть: 12,5 + 0,75","13,25",["13,00","12,75","13,75"],"12,50 + 0,75 = 13,25."],
["Довжина стрічки — 8,4 м. Відрізали 3,75 м. Скільки метрів стрічки залишилось?","4,65",["5,35","4,75","5,65"],"8,40 − 3,75 = 4,65 (м)."]]],
["Десяткові дроби: × і :","🎯",45,[
["Обчисліть: 3,4 × 2,5","8,5",["85","0,85","6,9"],"34 × 25 = 850; у множниках 2 цифри після коми, тож 8,50 = 8,5."],
["Обчисліть: 12,6 : 3","4,2",["42","0,42","4,02"],"12 : 3 = 4, 0,6 : 3 = 0,2, разом 4,2."],
["Обчисліть: 7,2 : 0,9","8",["80","0,8","6,4"],"Переносимо коми: 72 : 9 = 8."],
["1 кг яблук коштує 24,5 грн. Скільки гривень коштують 4 кг?","98",["96","98,5","92"],"24,5 × 4 = 98 (грн)."]]]
];
const NQ=4,TOT=B.length*NQ,$=s=>document.querySelector(s),app=$("#app");
let S;try{S=JSON.parse(localStorage.getItem("hw5"))}catch(e){}
S=S||{name:"",b:0,q:0,a:{},v:"start"};
const save=()=>{try{localStorage.setItem("hw5",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fx=s=>esc(s).replace(/(\d*)\{(\d+)\|(\d+)\}/g,(m,w,a,b)=>(w?`<span class=w>${w}</span>`:"")+`<span class=f><i>${a}</i><i>${b}</i></span>`);
const plain=s=>String(s).replace(/(\d*)\{(\d+)\|(\d+)\}/g,(m,w,a,b)=>(w?w+" ":"")+a+"/"+b);
const nm=s=>String(s).replace(/[\s\u00a0]/g,"").replace(".",",").toLowerCase();
const sh=(a,s)=>{a=[...a];for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)&0x7fffffff;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const key=(b,q)=>b+"-"+q,got=(b,q)=>S.a[key(b,q)];
const okq=(b,q)=>{const g=got(b,q);return g!==undefined&&nm(g)==nm(B[b][3][q][1])};
const cnt=b=>[0,1,2,3].filter(q=>okq(b,q)).length;
const grade=c=>c?Math.max(1,Math.round(c/NQ*12)):1;
const gc=g=>g>=10?"hi":g>=7?"md":"lo";
const label=g=>g>=11?"Блискуче! 🏆":g>=9?"Дуже добре! 🎉":g>=7?"Непогано, є що підтягнути":g>=4?"Потрібно ще попрактикуватись":"Давай повторимо тему разом";
const meanG=()=>Math.round(B.reduce((s,_,b)=>s+grade(cnt(b)),0)/B.length);
const setC=h=>document.documentElement.style.setProperty("--c",`hsl(${h} 78% 60%)`);
const go=v=>{S.v=v;save();render();scrollTo(0,0)};
function render(){({start,quiz,blk,fin})[S.v]()}

function start(){
 setC(250);const n=Object.keys(S.a).length;
 app.innerHTML=`<div class=stack><div style="padding:14px 4px 4px"><span class=chip>Домашня робота</span><h1>Математика<br><em>5 клас</em></h1><p class=mu style="margin:0;max-width:30em">8 тем по 4 завдання. Після кожної теми отримаєш оцінку за 12-бальною шкалою, а в кінці — підсумок із розбором помилок.</p></div>
 <div class=card><label class=mu style="font-weight:700;font-size:14px">Твоє ім’я</label><input id=nm placeholder="Наприклад, Софія" value="${esc(S.name)}" style="margin-top:8px;font-family:Onest"><button class=btn id=go>${n?"Продовжити":"Почати"}</button>${n?`<button class="btn ghost" id=rs style="margin-top:10px">Почати спочатку</button>`:""}</div>
 ${B.map((x,i)=>`<div class=blk><div class=e>${x[1]}</div><div>${x[0]}<small>Тема ${i+1} · ${NQ} завдання</small></div>${n&&(S.b>i||S.v=="fin")?`<span class="sc ${gc(grade(cnt(i)))}">${grade(cnt(i))}<small>/12</small></span>`:""}</div>`).join("")}</div>`;
 $("#go").onclick=()=>{S.name=$("#nm").value.trim();if(S.v=="start"&&!n)S.b=S.q=0;go(Object.keys(S.a).length>=TOT?"fin":"quiz")};
 const r=$("#rs");if(r)r.onclick=()=>{if(confirm("Стерти всі відповіді й почати спочатку?")){S={name:S.name,b:0,q:0,a:{},v:"quiz"};save();render()}};
}

function quiz(){
 const b=S.b,q=S.q,d=B[b],t=d[3][q],g=got(b,q),done=g!==undefined,typed=!t[2].length;
 setC(d[2]);
 const seg=[0,1,2,3].map(i=>`<i class="${i==q&&!done?"now":got(b,i)===undefined?(i==q?"now":""):okq(b,i)?"ok":"no"}"></i>`).join("");
 const opts=sh([t[1],...t[2]],(b*7+q+3)*977);
 let body;
 if(typed)body=done?`<input disabled value="${esc(g)}" style="border-color:var(--${okq(b,q)?"ok":"bad"})">`:`<input id=in inputmode="decimal" autocomplete="off" placeholder="Твоя відповідь"><button class=btn id=chk>Перевірити</button>`;
 else body=`<div class=opts>${opts.map((o,i)=>`<button class="opt ${done?(o==t[1]?"ok":o==g?"no":""):""}" data-i="${i}" ${done?"disabled":""}>${fx(o)}</button>`).join("")}</div>`;
 const ok=done&&okq(b,q);
 const fb=done?`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Правильно! ✓":"Не зовсім ✗"}</b><p>${ok?"":`Правильна відповідь: <strong>${fx(t[1])}</strong>. `}${fx(t[3])}</p><button class=btn id=nx>${q<NQ-1?"Далі":"Завершити тему"}</button></div>`:"";
 app.innerHTML=`<div class=top><span class=chip>${d[1]} Тема ${b+1} з ${B.length}</span><span class=mu>Завдання ${b*NQ+q+1} з ${TOT}</span></div><div class=seg>${seg}</div><div class=card><div class=mu style="font-weight:700;font-size:14px">${d[0]}</div><div class=q>${fx(t[0])}</div>${body}${fb}</div>`;
 const ans=v=>{S.a[key(b,q)]=v;save();quiz();setTimeout(()=>$("#nx")&&$("#nx").scrollIntoView({block:"nearest",behavior:"smooth"}),60)};
 app.querySelectorAll(".opt").forEach(e=>e.onclick=()=>ans(opts[e.dataset.i]));
 const chk=()=>{const v=$("#in").value.trim();if(v)ans(v)};
 if($("#chk")){$("#chk").onclick=chk;$("#in").onkeydown=e=>{if(e.key=="Enter")chk()};$("#in").focus()}
 if($("#nx"))$("#nx").onclick=()=>{if(q<NQ-1){S.q++;save();quiz();scrollTo(0,0)}else go("blk")};
}

function blk(){
 const b=S.b,d=B[b],c=cnt(b),g=grade(c);setC(d[2]);const last=b==B.length-1;
 app.innerHTML=`<div class=top><span class=chip>${d[1]} ${d[0]}</span><span class=mu>Тема ${b+1} з ${B.length}</span></div><div class=card style="text-align:center"><div class=mu style="font-weight:700">Оцінка за тему</div><div class="grade ${gc(g)}">${g}<small>/12</small></div><div class=gl>${label(g)}</div><div class=seg style="margin-bottom:6px">${[0,1,2,3].map(i=>`<i class="${okq(b,i)?"ok":"no"}"></i>`).join("")}</div><p class=mu style="margin:0 0 18px">Правильно: ${c} із ${NQ}</p><button class=btn id=nx>${last?"Побачити підсумок":"До наступної теми"}</button></div>`;
 $("#nx").onclick=()=>{if(last)go("fin");else{S.b++;S.q=0;go("quiz")}};
}

function summary(){
 const L=[`Домашня робота · Математика 5 клас${S.name?" · "+S.name:""}`,`Підсумкова оцінка: ${meanG()}/12`,""];
 B.forEach((d,b)=>{L.push(`${d[0]}: ${grade(cnt(b))}/12 (${cnt(b)}/${NQ})`);[0,1,2,3].filter(q=>!okq(b,q)).forEach(q=>L.push(`  ✗ ${plain(d[3][q][0])} — відповідь учениці: ${plain(got(b,q)??"—")}, правильно: ${plain(d[3][q][1])}`))});
 return L.join("\n");
}

function fin(){
 setC(250);const g=meanG(),all=B.reduce((s,_,b)=>s+cnt(b),0);
 const wrong=B.map((d,b)=>[0,1,2,3].filter(q=>!okq(b,q)).map(q=>({d,t:d[3][q],g:got(b,q)}))).flat();
 app.innerHTML=`<div class=stack><div class=card style="text-align:center"><div class=mu style="font-weight:700">${S.name?esc(S.name)+", твоя підсумкова оцінка":"Підсумкова оцінка"}</div><div class="grade ${gc(g)}">${g}<small>/12</small></div><div class=gl>${label(g)}</div><div class=tiles><div><b class=hi>${all}</b><span>правильно</span></div><div><b class=lo>${TOT-all}</b><span>помилок</span></div><div><b>${Math.round(all/TOT*100)}%</b><span>успішність</span></div></div>${(()=>{const s=B.map((d,b)=>[cnt(b),d[0]]);const hi=Math.max(...s.map(x=>x[0])),lo=Math.min(...s.map(x=>x[0]));return hi==lo?"":`<p class=mu style="margin:14px 0 0;font-size:15px">Найкраще: <b style="color:var(--tx)">${s.find(x=>x[0]==hi)[1]}</b><br>Потребує уваги: <b style="color:var(--tx)">${s.find(x=>x[0]==lo)[1]}</b></p>`})()}</div>
 <div class=card><h2 style="margin-bottom:6px">Оцінки за теми</h2>${B.map((d,b)=>{const x=cnt(b),y=grade(x);return`<div style="display:flex;gap:12px;align-items:center;padding:10px 0"><div style="font-size:22px">${d[1]}</div><div style="flex:1;font-weight:700;line-height:1.25">${d[0]}<div class=bar><i style="width:${x/NQ*100}%;background:var(--${y>=10?"ok":y>=7?"mid":"bad"})"></i></div></div><div class="sc ${gc(y)}">${y}<small>/12</small></div></div>`}).join("")}</div>
 <div class=card><h2 style="margin-bottom:8px">${wrong.length?"Над чим попрацювати":"Помилок немає 🎉"}</h2>${wrong.length?wrong.map(w=>`<div class=wr><span class=chip>${w.d[1]} ${w.d[0]}</span><div class=t>${fx(w.t[0])}</div><div class=r>Твоя відповідь: <span class=lo>${fx(w.g??"—")}</span><br>Правильно: <span class=hi>${fx(w.t[1])}</span></div><p class=mu style="margin:6px 0 4px;font-size:15px">${fx(w.t[3])}</p></div>`).join(""):`<p class=mu style="margin:0">Усі завдання виконано правильно. Чудова робота!</p>`}</div>
 <button class=btn id=sd>Надіслати результат вчителю</button><button class="btn ghost" id=rs>Пройти ще раз</button></div>`;
 $("#sd").onclick=async()=>{const t=summary();try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name=="AbortError")return}
  try{await navigator.clipboard.writeText(t);toast("Результат скопійовано")}catch(e){prompt("Скопіюй результат:",t)}};
 $("#rs").onclick=()=>{if(confirm("Стерти відповіді й пройти заново?")){S={name:S.name,b:0,q:0,a:{},v:"quiz"};save();render();scrollTo(0,0)}};
}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2200)}
if(!["start","quiz","blk","fin"].includes(S.v))S.v="start";
render();
</script>
</body>
</html>
